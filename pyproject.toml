[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag-studio"
version = "1.0.0"
description = "Multimodal document ingestion and evidence-grounded conversations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "python-multipart==0.0.32",
    "pymupdf==2.0",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "xlrd==2.0.2",
    "beautifulsoup4==4.15.0",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "Pillow==12.3.0",
    "cryptography==50.0.2",
    "fastembed==0.9.0",
    "imageio-ffmpeg==0.6.0",
    "faster-whisper==1.2.1",
    "matplotlib==3.11.2",
    "av==16.1.0",
    "azure-identity==1.26.0",
    "azure-storage-blob==12.31.0",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff==0.17.3", "build>=1.2"]

[project.scripts]
agentic-rag = "app.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.data-files]
"share/agentic-rag/frontend" = [
    "frontend/index.html",
    "frontend/app.js",
    "frontend/style.css",
    "frontend/icon.svg",
]
"share/agentic-rag/examples" = ["docs/examples/*.csv", "docs/examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
cache_dir = "work/.pytest_cache"

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "work/.ruff_cache"
src = ["backend/src"]

[tool.ruff.lint]
select = ["F", "I"]

[tool.ruff.lint.isort]
lines-after-imports = 1

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
